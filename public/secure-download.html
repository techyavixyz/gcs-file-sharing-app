<!DOCTYPE html>
<html>
<body style="font-family:Arial;padding:30px">

<h2>🔐 Secure Download</h2>

<input id="uid" placeholder="Enter UserId"><br><br>

<button onclick="go()">Download</button>

<script>
function token(){
  return new URLSearchParams(location.search).get("token");
}

function go(){
  const f = document.createElement("form");
  f.method="POST";
  f.action="/validate-download";

  f.innerHTML =
    '<input name="token" value="'+token()+'">'+
    '<input name="userId" value="'+document.getElementById("uid").value+'">';

  document.body.appendChild(f);
  f.submit();
}
</script>

</body>
</html>
