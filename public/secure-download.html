<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Secure Download</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0c10;
      --surface:   #111318;
      --border:    #1e2230;
      --border-glow: rgba(0,210,140,0.35);
      --accent:    #00d28c;
      --accent-dim:#00a86e;
      --accent-glow: rgba(0,210,140,0.12);
      --text:      #e8eaf0;
      --muted:     #5a6070;
      --danger:    #ff4d6a;
      --font-head: 'Syne', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ── Background grid + radial glow ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(0,210,140,0.07) 0%, transparent 70%),
        linear-gradient(rgba(0,210,140,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,210,140,0.03) 1px, transparent 1px);
      background-size: 100% 100%, 44px 44px, 44px 44px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Card ── */
    .card {
      position: relative;
      z-index: 1;
      width: min(420px, 92vw);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 44px 40px 40px;
      box-shadow:
        0 0 0 1px rgba(0,210,140,0.06),
        0 24px 60px rgba(0,0,0,0.55),
        0 0 80px rgba(0,210,140,0.04);
      animation: rise 0.55s cubic-bezier(0.16,1,0.3,1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(28px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* top accent bar */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      border-radius: 0 0 4px 4px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 32px;
    }

    .icon-ring {
      width: 46px; height: 46px;
      border-radius: 12px;
      border: 1px solid var(--border-glow);
      background: var(--accent-glow);
      display: grid; place-items: center;
      flex-shrink: 0;
      box-shadow: 0 0 20px rgba(0,210,140,0.15);
    }

    .icon-ring svg { width: 22px; height: 22px; stroke: var(--accent); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .title-block h1 {
      font-family: var(--font-head);
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1.2;
    }

    .title-block p {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 3px;
    }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: var(--border);
      margin-bottom: 28px;
    }

    /* ── Field ── */
    .field {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      display: flex;
      pointer-events: none;
    }

    .input-icon svg { width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: stroke 0.2s; }

    input[type="text"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 16px 13px 42px;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      letter-spacing: 0.04em;
    }

    input[type="text"]::placeholder { color: var(--muted); }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    input[type="text"]:focus + .input-icon svg,
    .input-wrap:focus-within .input-icon svg { stroke: var(--accent); }

    /* reverse icon order trick — icon before input in HTML */
    .input-wrap input:focus ~ .input-icon svg { stroke: var(--accent); }

    /* ── Button ── */
    button {
      width: 100%;
      margin-top: 4px;
      padding: 14px 20px;
      background: var(--accent);
      color: #001a10;
      font-family: var(--font-head);
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s, transform 0.12s, box-shadow 0.2s;
      box-shadow: 0 4px 24px rgba(0,210,140,0.25);
      position: relative;
      overflow: hidden;
    }

    button::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0);
      transition: background 0.15s;
    }

    button:hover {
      background: #00e89c;
      box-shadow: 0 6px 32px rgba(0,210,140,0.38);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(1px);
      box-shadow: 0 2px 12px rgba(0,210,140,0.2);
    }

    button svg { width: 17px; height: 17px; stroke: #001a10; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

    /* ── Footer note ── */
    .note {
      margin-top: 22px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 14px;
      background: rgba(0,210,140,0.05);
      border: 1px solid rgba(0,210,140,0.12);
      border-radius: 8px;
    }

    .note svg { width: 14px; height: 14px; stroke: var(--accent); fill: none; stroke-width: 2; flex-shrink: 0; stroke-linecap: round; stroke-linejoin: round; }

    .note span {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.03em;
      line-height: 1.4;
    }

    .note span strong { color: var(--accent); font-weight: 500; }
  </style>
</head>
<body>

  <div class="card">

    <div class="header">
      <div class="icon-ring">
        <!-- Lock icon -->
        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <div class="title-block">
        <h1>Secure Download</h1>
        <p>Identity verification required</p>
      </div>
    </div>

    <div class="divider"></div>

    <div class="field">
      <label for="uid">User ID</label>
      <div class="input-wrap">
        <input type="text" id="uid" placeholder="Enter your User ID" autocomplete="off" spellcheck="false"/>
        <div class="input-icon">
          <!-- User icon -->
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        </div>
      </div>
    </div>

    <button onclick="go()">
      <!-- Download icon -->
      <svg viewBox="0 0 24 24"><path d="M12 3v13m-5-5 5 5 5-5"/><path d="M4 20h16"/></svg>
      Download File
    </button>

    <div class="note">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg>
      <span>Your session is protected by a <strong>signed token</strong>. This link is single-use and expires automatically.</span>
    </div>

  </div>

  <script>
    function token() {
      return new URLSearchParams(location.search).get("token");
    }

    function go() {
      const f = document.createElement("form");
      f.method = "POST";
      f.action = "/validate-download";

      f.innerHTML =
        '<input name="token" value="' + token() + '">' +
        '<input name="userId" value="' + document.getElementById("uid").value + '">';

      document.body.appendChild(f);
      f.submit();
    }
  </script>

</body>
</html>
