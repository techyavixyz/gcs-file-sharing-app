<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  background:#0b0f17;
  color:#e8eaf6;
  font-family: monospace;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.card {
  width:480px;
  background:#111722;
  padding:30px;
  border-radius:12px;
  border:1px solid #1e2535;
  max-height:90vh;
  overflow:auto;
  position:relative;
}

/* ===== TOAST NOTIFICATION ===== */
#toastContainer {
  position:absolute;
  top:10px;
  right:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
  z-index:999;
}

.toast {
  background:#00e5ff;
  color:#000;
  padding:10px 14px;
  border-radius:8px;
  font-size:12px;
  animation:fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity:0; transform:translateY(-10px); }
  to { opacity:1; transform:translateY(0); }
}

input, select {
  width:100%;
  padding:10px;
  margin-bottom:12px;
  background:#0b0f17;
  border:1px solid #1e2535;
  color:#fff;
}

button {
  width:100%;
  padding:12px;
  background:#00e5ff;
  border:none;
  cursor:pointer;
  margin-top:10px;
}

/* ===== LOADER ===== */
#loader {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(8,10,15,0.85);
  backdrop-filter: blur(6px);
  z-index:9999;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.spinner {
  width:50px;
  height:50px;
  border:3px solid #1e2535;
  border-top-color:#00e5ff;
  border-radius:50%;
  animation:spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform:rotate(360deg); }
}
</style>

</head>
<body>

<div class="card">

<!-- 🔥 TOAST AREA -->
<div id="toastContainer"></div>

<h2>🔐 Admin Access</h2>

<!-- LOGIN -->
<div id="loginSection">
  <select id="approver"></select>
  <button onclick="generateAccess()">Generate ID</button>

  <input id="adminId" placeholder="Enter ID">
  <button onclick="verify()">Verify</button>
</div>

<!-- REGISTER -->
<div id="registerSection" style="display:none;">
  <h3>📦 Register File</h3>

  <input id="fileName" placeholder="file.pdf">
  <input id="gcsPath" placeholder="gs://bucket/file.pdf">
  <input id="userId" placeholder="UserId">

  <button onclick="registerFile()">Submit</button>

  <h3>📨 Requests</h3>
  <div id="requestList"></div>
</div>

</div>

<!-- LOADER -->
<div id="loader">
  <div class="spinner"></div>
</div>

<script>

let adminToken = "";
let lastCount = 0;

// ===== TOAST FUNCTION =====
function showToast(msg){
  const div = document.createElement("div");
  div.className = "toast";
  div.innerText = msg;

  document.getElementById("toastContainer").appendChild(div);

  setTimeout(()=>{
    div.remove();
  }, 4000);
}

// ===== LOADER =====
function showLoader(){ document.getElementById("loader").style.display="flex"; }
function hideLoader(){ document.getElementById("loader").style.display="none"; }

// ===== LOAD APPROVERS =====
async function loadApprovers(){
  const res = await fetch('/admin/approvers');
  const data = await res.json();

  const select = document.getElementById("approver");
  data.approvers.forEach(a=>{
    const opt = document.createElement("option");
    opt.value = a;
    opt.innerText = a;
    select.appendChild(opt);
  });
}
window.onload = loadApprovers;

// ===== GENERATE ACCESS =====
async function generateAccess(){
  const approver = document.getElementById("approver").value;

  showLoader();
  await fetch('/admin/generate-access',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ approver })
  });

  hideLoader();
  alert("ID sent to approver");
}

// ===== VERIFY =====
async function verify(){
  const accessId = document.getElementById("adminId").value;

  showLoader();
  const res = await fetch('/admin/verify',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ accessId })
  });

  const data = await res.json();
  hideLoader();

  if(data.token){
    adminToken = data.token;
    document.getElementById("loginSection").style.display="none";
    document.getElementById("registerSection").style.display="block";

    loadRequests();
    setInterval(loadRequests, 4000);
  } else {
    alert("Invalid ID");
  }
}

// ===== REGISTER FILE =====
async function registerFile(){
  showLoader();

  await fetch('/register-file',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer '+adminToken
    },
    body: JSON.stringify({
      fileName: fileName.value,
      gcsPath: gcsPath.value,
      userId: userId.value
    })
  });

  hideLoader();
  showToast(" File mapped successfully");
}

// ===== LOAD REQUESTS =====
async function loadRequests(){

  const res = await fetch('/admin/requests');
  const data = await res.json();

  // 🔥 NEW REQUEST DETECT
  if(data.count > lastCount){
    showToast(" New request received!");
  }

  lastCount = data.count;

  const container = document.getElementById("requestList");
  container.innerHTML = "";

  data.requests.slice().reverse().forEach(r=>{
    const div = document.createElement("div");
    div.style.border="1px solid #1e2535";
    div.style.margin="8px 0";
    div.style.padding="8px";

    div.innerHTML = `
      <b>${r.name}</b><br>
      ${r.requirement}<br>
      ID: ${r.userId}
    `;

    container.appendChild(div);
  });
}

</script>

</body>
</html>
