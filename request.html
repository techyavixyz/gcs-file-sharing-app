<!DOCTYPE html>
<html>
<head>
  <title>File Access Portal</title>
</head>

<body style="background:#0b0b0b; color:white; font-family:Arial; padding:40px;">

<h2 style="text-align:center;"> File Access Portal</h2>

<div style="display:flex; justify-content:space-between; margin-top:40px;">

  <!-- LEFT -->
  <div style="border:1px solid #555; padding:30px; width:45%;">
    <h3>📥 Request File</h3>

    <input id="req" placeholder="Describe requirement" style="width:100%; padding:10px;"><br><br>
    <input id="name" placeholder="Your Name" style="width:100%; padding:10px;"><br><br>

    <button onclick="request()">Send Request</button>

    <p id="reqOut"></p>
  </div>

  <!-- RIGHT -->
  <div style="border:1px solid #555; padding:30px; width:45%;">
    <h3>🔐 Get Secure Download URL</h3>

    <input id="uid" placeholder="Enter UserId (given by admin)" style="width:100%; padding:10px;"><br><br>

    <button onclick="getLink()">Get Download Link</button>

    <p id="out"></p>
  </div>

</div>

<!--  LOADER -->
<div id="loader" style="
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.7);
  color:white;
  font-size:22px;
  justify-content:center;
  align-items:center;
">
  ⏳ Processing...
</div>

<script>

// ===== SHOW LOADER =====
function showLoader(){
  document.getElementById("loader").style.display = "flex";
}

// ===== HIDE LOADER =====
function hideLoader(){
  document.getElementById("loader").style.display = "none";
}


// ===== REQUEST FILE =====
async function request(){
  showLoader();

  try {
    const res = await fetch('/request-file',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        name: document.getElementById("name").value,
        requirement: document.getElementById("req").value
      })
    });

    await res.json();

    document.getElementById("reqOut").innerHTML =
      " Request sent successfully";
  } catch (err) {
    document.getElementById("reqOut").innerText =
      " Failed to send request";
  }

  hideLoader();
}


// ===== GET SECURE LINK =====
async function getLink(){
  showLoader();

  try {
    const res = await fetch('/get-secure-link',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        userId: document.getElementById("uid").value
      })
    });

    const data = await res.json();

    if(data.url){
      document.getElementById("out").innerHTML =
        '<a href="'+data.url+'" target="_blank" style="color:#4CAF50;">🔗 Download File</a>';
    } else {
      document.getElementById("out").innerText = data.error;
    }

  } catch (err) {
    document.getElementById("out").innerText =
      "❌ Failed to fetch link";
  }

  hideLoader();
}

</script>

</body>
</html>
